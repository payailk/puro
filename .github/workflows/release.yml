name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to embed in the binaries'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character commit SHA from robinzzz1/puro on Gitee'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
            asset: puro-darwin-x64
            arch: x86_64
          - target: darwin-arm64
            runner: macos-15
            asset: puro-darwin-arm64
            arch: arm64
          - target: windows-x64
            runner: windows-2022
            asset: puro-windows-x64.exe
            arch: x86_64
    defaults:
      run:
        shell: bash
        working-directory: puro
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact Gitee source
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be an exact 40-character hexadecimal commit SHA.' >&2
            exit 1
          fi
          source_sha="$(printf '%s' "$SOURCE_SHA" | tr 'A-F' 'a-f')"
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://gitee.com/robinzzz1/puro.git "$source_sha"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "Gitee source commit: $source_sha"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.5'
      - name: Validate version, source, and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${RELEASE_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          test "$(uname -m)" = "$EXPECTED_ARCH"
          echo "Building source commit: $(git rev-parse HEAD)"
          echo "PURO_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - run: dart pub get
      - name: Analyze and test
        if: github.event_name == 'push' && matrix.target == 'darwin-x64'
        run: |
          dart analyze
          dart test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/puro-tests.log"
          bash -n ../installer/install.sh
          python3 ../installer/test_install.py
      - name: Summarize test failure
        if: failure() && github.event_name == 'push' && matrix.target == 'darwin-x64'
        run: |
          if [ -f "$RUNNER_TEMP/puro-tests.log" ]; then
            printf '### Dart test output\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/puro-tests.log" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile and verify version
        env:
          ASSET: ${{ matrix.asset }}
          PURO_ROOT: ${{ runner.temp }}/puro-release-smoke
        run: |
          mkdir -p ../dist
          dart compile exe bin/puro.dart -o "../dist/$ASSET" "--define=puro_version=$PURO_RELEASE_VERSION"
          actual_version="$("../dist/$ASSET" --no-install --no-update-check version --plain)"
          test "$actual_version" = "$PURO_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish Gitee Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum puro-darwin-arm64 puro-darwin-x64 puro-windows-x64.exe > SHA256SUMS
          cp ../installer/install.sh .
      - name: Publish all assets to Gitee
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          python3 installer/publish_gitee.py \
            --repository robinzzz1/puro \
            --version "${GITHUB_REF_NAME#v}" \
            --directory dist
